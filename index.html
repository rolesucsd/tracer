<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Tracer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<title>Tracer</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; overflow: hidden;
    font: 15px -apple-system, system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  #video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  #stage { position: fixed; inset: 0; }
  #overlay { position: absolute; left: 50%; top: 50%; max-width: none; transform-origin: center;
    pointer-events: none; display: none; }
  #msg { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    text-align: center; padding: 24px; color: #bbb; pointer-events: none; }
  #bar { position: fixed; left: 0; right: 0; bottom: 0; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,.55); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
  #bar.hidden { display: none; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row + .row { margin-top: 10px; }
  .row label { width: 64px; color: #ccc; font-size: 13px; }
  input[type=range] { flex: 1; accent-color: #fff; }
  button, .btn { flex: 1; padding: 10px 4px; border: 0; border-radius: 10px; background: rgba(255,255,255,.15);
    color: #fff; font: inherit; font-size: 13px; text-align: center; }
  button.on { background: #fff; color: #000; }
  .row label.btn { width: auto; color: #fff; font-size: 13px; }
  #file { display: none; }
  #show { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); display: none;
    flex: none; width: 44px; height: 44px; border-radius: 22px; background: rgba(0,0,0,.5); font-size: 18px; }
</style>
</head>
<body>
<video id="video" autoplay playsinline muted></video>
<div id="stage"><img id="overlay" alt=""></div>
<div id="msg">Tap “Photo” to choose an image.</div>

<div id="bar">
  <div class="row">
    <label for="opacity">Opacity</label>
    <input id="opacity" type="range" min="0" max="1" step="0.01" value="0.5">
  </div>
  <div class="row">
    <label class="btn" for="file">Photo</label>
    <button id="lock">Lock</button>
    <button id="flip">Flip</button>
    <button id="gray">B/W</button>
    <button id="reset">Reset</button>
    <button id="hide">Hide</button>
  </div>
</div>
<button id="show">☰</button>
<input id="file" type="file" accept="image/*">

<script>
const $ = id => document.getElementById(id);
const video = $('video'), img = $('overlay'), stage = $('stage'), msg = $('msg');
const S = { x: 0, y: 0, scale: 1, rot: 0, flip: false, gray: false, locked: false, opacity: 0.5 };

// Settings persist between launches
try { Object.assign(S, JSON.parse(localStorage.getItem('tracer') || '{}')); } catch {}
const save = () => { try { localStorage.setItem('tracer', JSON.stringify(S)); } catch {} };

function render() {
  img.style.transform = `translate(-50%,-50%) translate(${S.x}px,${S.y}px) rotate(${S.rot}rad) scale(${S.scale}) scaleX(${S.flip ? -1 : 1})`;
  img.style.opacity = S.opacity;
  img.style.filter = S.gray ? 'grayscale(1) contrast(1.2)' : 'none';
  $('opacity').value = S.opacity;
  $('lock').classList.toggle('on', S.locked);
  $('flip').classList.toggle('on', S.flip);
  $('gray').classList.toggle('on', S.gray);
  $('lock').textContent = S.locked ? 'Locked' : 'Lock';
}

// Camera (rear)
async function startCamera() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } }, audio: false });
    video.srcObject = stream;
  } catch (e) { msg.textContent = 'Camera unavailable: ' + e.message; }
}
startCamera();

// Keep screen on
let wakeLock;
async function keepAwake() { try { wakeLock = await navigator.wakeLock?.request('screen'); } catch {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
keepAwake();

// Image storage (IndexedDB) so the last photo is there next launch
const db = new Promise(res => {
  const r = indexedDB.open('tracer', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('kv');
  r.onsuccess = () => res(r.result); r.onerror = () => res(null);
});
async function putImage(blob) { const d = await db; if (d) d.transaction('kv', 'readwrite').objectStore('kv').put(blob, 'img'); }
async function getImage() {
  const d = await db; if (!d) return null;
  return new Promise(res => { const r = d.transaction('kv').objectStore('kv').get('img'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
}
function showImage(blob) {
  img.onload = () => { img.style.display = 'block'; msg.style.display = 'none'; };
  img.src = URL.createObjectURL(blob);
  img.style.width = Math.min(innerWidth, innerHeight) * 0.9 + 'px';
}
getImage().then(b => b && showImage(b));

$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  Object.assign(S, { x: 0, y: 0, scale: 1, rot: 0 }); save(); render();
  showImage(f); putImage(f); e.target.value = '';
};

// Controls
$('opacity').oninput = e => { S.opacity = +e.target.value; render(); save(); };
$('lock').onclick = () => { S.locked = !S.locked; render(); save(); };
$('flip').onclick = () => { S.flip = !S.flip; render(); save(); };
$('gray').onclick = () => { S.gray = !S.gray; render(); save(); };
$('reset').onclick = () => { Object.assign(S, { x: 0, y: 0, scale: 1, rot: 0 }); render(); save(); };
$('hide').onclick = () => { $('bar').classList.add('hidden'); $('show').style.display = 'block'; };
$('show').onclick = () => { $('bar').classList.remove('hidden'); $('show').style.display = 'none'; };

// Gestures: 1 finger = move, 2 fingers = zoom + rotate
const pts = new Map(); let start = null;
const snapshot = () => {
  const p = [...pts.values()];
  const g = { x: S.x, y: S.y, scale: S.scale, rot: S.rot, cx: p[0].x, cy: p[0].y };
  if (p.length > 1) {
    g.cx = (p[0].x + p[1].x) / 2; g.cy = (p[0].y + p[1].y) / 2;
    g.dist = Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y);
    g.ang = Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x);
  }
  return g;
};
stage.addEventListener('pointerdown', e => {
  if (S.locked) return;
  stage.setPointerCapture(e.pointerId);
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); start = snapshot();
});
stage.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId) || S.locked) return;
  pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  const p = [...pts.values()];
  if (p.length === 1) {
    S.x = start.x + p[0].x - start.cx; S.y = start.y + p[0].y - start.cy;
  } else {
    const cx = (p[0].x + p[1].x) / 2, cy = (p[0].y + p[1].y) / 2;
    S.scale = start.scale * Math.hypot(p[1].x - p[0].x, p[1].y - p[0].y) / start.dist;
    S.rot = start.rot + Math.atan2(p[1].y - p[0].y, p[1].x - p[0].x) - start.ang;
    S.x = start.x + cx - start.cx; S.y = start.y + cy - start.cy;
  }
  render();
});
const end = e => { if (pts.delete(e.pointerId)) { start = pts.size ? snapshot() : null; save(); } };
stage.addEventListener('pointerup', end); stage.addEventListener('pointercancel', end);

render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
